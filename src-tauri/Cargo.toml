[package]
name = "nexus"
version = "0.1.0"
description = "Local-first marketplace arbitrage scanner"
authors = ["Kieran Kelly"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
async-trait = "0.1.89"
chrono = "0.4.45"
sha2 = "0.11.0"
refinery = { version = "0.9.2", features = ["rusqlite"] }
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }
hex = "0.4.3"
# time 0.3.48's blanket From<T: ModifierValue> impl conflicts (E0119) with cookie/tauri-utils; pin until fixed upstream.
time = "=0.3.47"
tokio = { version = "1.52.3", features = ["io-util", "macros", "process", "rt", "time"] }
scraper = "0.27.0"
rand = "0.10.1"
image_hasher = "3.1.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "form", "query"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }

